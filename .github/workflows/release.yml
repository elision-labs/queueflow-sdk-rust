name: Release

# Publish the crate to crates.io when a v* tag is pushed. Requires the
# CARGO_REGISTRY_TOKEN repository secret (a crates.io token scoped to
# publish-update for queueflow-sdk).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the tag matches Cargo.toml
        run: |
          v="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          [ "v${v}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml version ${v}" >&2; exit 1; }
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "${CARGO_REGISTRY_TOKEN}" ] || { echo "::error::CARGO_REGISTRY_TOKEN secret is not set" >&2; exit 1; }
          cargo publish --allow-dirty
